initial_condition: "DryBaroclinicWave"
t_end: "5days"
disable_surface_flux_tendency: true
chemistry: "tropospheric"
# OH is prescribed from a 3-D look-up table (empty path → uniform 1e6 molecules cm⁻³ fallback).
chemistry_oh_lut_path: ""
chemistry_co_emission: 1.0e-10
dt: "60secs"
diagnostics:
  - short_name: [pfull, ua, wa, va, ta]
    period: 6hours
  - short_name: [mmrco]
    period: 3hours
split_ode: false
